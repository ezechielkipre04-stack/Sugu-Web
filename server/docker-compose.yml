# SUGU API — déploiement HTTPS avec Caddy
#
# 1. Renseignez server/.env (OTP_SECRET, fournisseurs…) puis ajoutez :
#      DOMAIN=api.sugu.ci
#      PUBLIC_ORIGIN=https://app.sugu.ci
# 2. Faites pointer le DNS de DOMAIN vers ce serveur.
# 3. docker compose up -d --build
#
# Caddy obtient et renouvelle automatiquement le certificat TLS.

services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      TRUST_PROXY: 'true'
      OTP_DEBUG: 'false'
      DEMO_SEED: 'false'
      APP_ORIGIN: ${PUBLIC_ORIGIN}
    volumes:
      - sugu-data:/app/data
    expose:
      - '4000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  sugu-data:
  caddy-data:
  caddy-config:
